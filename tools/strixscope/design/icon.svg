<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2136"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="0.18" cy="0.08" r="0.7">
      <stop offset="0" stop-color="#508dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#508dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.9" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#e65695" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e65695" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraC" cx="0.5" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#e86333" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e86333" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3a8ff"/>
      <stop offset="0.55" stop-color="#8e7ef0"/>
      <stop offset="1" stop-color="#508dff"/>
    </linearGradient>
    <linearGradient id="ringR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8cc0"/>
      <stop offset="0.55" stop-color="#e65695"/>
      <stop offset="1" stop-color="#e86333"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf5a"/>
      <stop offset="1" stop-color="#be8800"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#1b2233"/>
      <stop offset="1" stop-color="#05070c"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="tuft" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e9edf7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e9edf7" stop-opacity="0.32"/>
    </linearGradient>
    <clipPath id="sq"><rect x="64" y="64" width="896" height="896" rx="216"/></clipPath>
  </defs>

  <!-- tile -->
  <g clip-path="url(#sq)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#auroraA)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#auroraB)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#auroraC)"/>
    <!-- facial disc: a faint heart-shaped owl face -->
    <path d="M512 300 C 400 210, 170 230, 168 470 C 166 700, 360 830, 512 860 C 664 830, 858 700, 856 470 C 854 230, 624 210, 512 300 Z"
          fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>
    <!-- ear tufts: three feathers each side -->
    <g fill="url(#tuft)">
      <path d="M300 318 C 262 250, 236 196, 214 130 C 268 186, 318 236, 352 292 Z"/>
      <path d="M262 334 C 222 280, 196 236, 168 184 C 224 226, 270 262, 304 306 Z" opacity="0.7"/>
      <path d="M342 300 C 318 240, 306 196, 300 150 C 334 200, 360 244, 380 284 Z" opacity="0.55"/>
      <path d="M724 318 C 762 250, 788 196, 810 130 C 756 186, 706 236, 672 292 Z"/>
      <path d="M762 334 C 802 280, 828 236, 856 184 C 800 226, 754 262, 720 306 Z" opacity="0.7"/>
      <path d="M682 300 C 706 240, 718 196, 724 150 C 690 200, 664 244, 644 284 Z" opacity="0.55"/>
    </g>
  </g>
  <rect x="65" y="65" width="894" height="894" rx="215" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- brows: a V that makes it an owl -->
  <path d="M232 360 Q 372 300 498 404" fill="none" stroke="#e9edf7" stroke-opacity="0.85" stroke-width="22" stroke-linecap="round"/>
  <path d="M792 360 Q 652 300 526 404" fill="none" stroke="#e9edf7" stroke-opacity="0.85" stroke-width="22" stroke-linecap="round"/>

  <!-- eye glows -->
  <circle cx="362" cy="540" r="150" fill="none" stroke="#8e7ef0" stroke-width="56" filter="url(#glow)" opacity="0.9"/>
  <circle cx="662" cy="540" r="150" fill="none" stroke="#e65695" stroke-width="56" filter="url(#glow)" opacity="0.9"/>

  <!-- eyes: two lenses, the two nodes -->
  <g>
    <circle cx="362" cy="540" r="150" fill="url(#iris)"/>
    <circle cx="362" cy="540" r="150" fill="none" stroke="url(#ringL)" stroke-width="40"/>
    <circle cx="362" cy="540" r="96" fill="none" stroke="#8e7ef0" stroke-opacity="0.55" stroke-width="6"/>
    <!-- scope ticks -->
    <g stroke="#cfd6ff" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round">
      <line x1="362" y1="430" x2="362" y2="458"/><line x1="362" y1="622" x2="362" y2="650"/>
      <line x1="252" y1="540" x2="280" y2="540"/><line x1="444" y1="540" x2="472" y2="540"/>
    </g>
    <circle cx="362" cy="540" r="50" fill="#03050a"/>
    <circle cx="341" cy="517" r="17" fill="#ffffff"/>
    <circle cx="384" cy="562" r="6" fill="#ffffff" fill-opacity="0.6"/>
  </g>
  <g>
    <circle cx="662" cy="540" r="150" fill="url(#iris)"/>
    <circle cx="662" cy="540" r="150" fill="none" stroke="url(#ringR)" stroke-width="40"/>
    <circle cx="662" cy="540" r="96" fill="none" stroke="#e65695" stroke-opacity="0.55" stroke-width="6"/>
    <g stroke="#ffd3e6" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round">
      <line x1="662" y1="430" x2="662" y2="458"/><line x1="662" y1="622" x2="662" y2="650"/>
      <line x1="552" y1="540" x2="580" y2="540"/><line x1="744" y1="540" x2="772" y2="540"/>
    </g>
    <circle cx="662" cy="540" r="50" fill="#03050a"/>
    <circle cx="641" cy="517" r="17" fill="#ffffff"/>
    <circle cx="684" cy="562" r="6" fill="#ffffff" fill-opacity="0.6"/>
  </g>

  <!-- the link between the eyes (the USB4 pair) -->
  <rect x="500" y="532" width="24" height="16" rx="8" fill="#e9edf7" fill-opacity="0.9"/>

  <!-- beak -->
  <path d="M512 640 L 548 690 Q 512 770 512 770 Q 512 770 476 690 Z" fill="url(#beak)"/>
  <path d="M512 640 L 548 690 Q 512 770 476 690 Z" fill="url(#beak)" filter="url(#soft)" opacity="0.6"/>
</svg>
