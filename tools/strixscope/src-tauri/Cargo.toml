[package]
name = "strixscope"
version = "0.1.3"
description = "Visual log analyzer for the StrixFold pair"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[lib]
name = "strixscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
regex = "1"
flate2 = "1"
libc = "0.2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"

[profile.release]
lto = "thin"
codegen-units = 4

[features]
self-update = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
